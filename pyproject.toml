[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-stock"
version = "0.1.0"
description = "Shadow-only research foundation for Polymarket daily equity direction markets"
requires-python = ">=3.11"
dependencies = ["rich>=13,<15", "websockets>=15,<16"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
polymarket-stock = "polymarket_stock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "DTZ"]

[tool.mypy]
python_version = "3.11"
packages = ["polymarket_stock"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
